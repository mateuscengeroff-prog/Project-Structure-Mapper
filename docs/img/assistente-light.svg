<svg xmlns="http://www.w3.org/2000/svg" width="860" height="716" viewBox="0 0 860 716" role="img" aria-labelledby="t d"><title id="t">Assistente do Project Structure Mapper</title><desc id="d">Transcrição de uma execução real do assistente: menu, três passos (pasta, tipo de relatório, pasta de saída), aviso de confidencialidade e resultado com 15 arquivos indexados, 16 referências estáticas e 1 arquivo sensível omitido.</desc><style>@font-face{font-family:PMono;src:url(data:font/woff;base64,) format('woff');}@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style><rect x=".5" y=".5" width="859" height="715" rx="6" fill="#F6F8F7" stroke="#D3DADE"/><circle cx="22" cy="20" r="4.5" fill="none" stroke="#C3CACF" stroke-width="1.5"/><circle cx="38" cy="20" r="4.5" fill="none" stroke="#C3CACF" stroke-width="1.5"/><circle cx="54" cy="20" r="4.5" fill="none" stroke="#C3CACF" stroke-width="1.5"/><text x="430.0" y="24.0" font-family="PMono" font-size="11" fill="#59626A" text-anchor="middle" >INICIAR_WINDOWS.bat  ·  assistente</text><line x1="0" y1="38" x2="860" y2="38" stroke="#D3DADE" stroke-width="1"/><text x="24.0" y="64.0" font-family="PMono" font-size="12.5" fill="#C3CACF" text-anchor="start" xml:space="preserve">============================================================</text><text x="24.0" y="83.0" font-family="PMono" font-size="12.5" fill="#1B2127" text-anchor="start" xml:space="preserve">   PROJECT STRUCTURE MAPPER  v2.1.0</text><text x="24.0" y="102.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">   Entenda a estrutura de um projeto em 3 passos</text><text x="24.0" y="121.0" font-family="PMono" font-size="12.5" fill="#C3CACF" text-anchor="start" xml:space="preserve">============================================================</text><text x="24.0" y="159.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">1) Mapear um projeto</text><text x="24.0" y="178.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">2) O que essa ferramenta faz?</text><text x="24.0" y="197.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">0) Sair</text><text x="24.0" y="216.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">Escolha uma opção [Enter = 1]: </text><text x="256.5" y="216.0" font-family="PMono" font-size="12.5" fill="#2D7560" text-anchor="start" >1</text><text x="24.0" y="254.0" font-family="PMono" font-size="12.5" fill="#1B2127" text-anchor="start" xml:space="preserve">PASSO 1/3 — Qual projeto vamos analisar?</text><text x="24.0" y="273.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">Cole o caminho da pasta ou pressione Enter para procurar: </text><text x="459.0" y="273.0" font-family="PMono" font-size="12.5" fill="#2D7560" text-anchor="start" >/home/demo/projetos/LojaExemplo</text><text x="24.0" y="311.0" font-family="PMono" font-size="12.5" fill="#1B2127" text-anchor="start" xml:space="preserve">PASSO 2/3 — Qual relatório você quer?</text><text x="24.0" y="330.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">1) Público/resumido: só números e tecnologias, sem nomes (mais seguro)</text><text x="24.0" y="349.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">2) Privado/detalhado: nomes de arquivos, árvore e referências (uso interno)</text><text x="24.0" y="368.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">Escolha 1 ou 2 [Enter = 1]: </text><text x="234.0" y="368.0" font-family="PMono" font-size="12.5" fill="#2D7560" text-anchor="start" >2</text><text x="24.0" y="406.0" font-family="PMono" font-size="12.5" fill="#1B2127" text-anchor="start" xml:space="preserve">PASSO 3/3 — Onde salvar o relatório? (sempre FORA do projeto)</text><text x="24.0" y="425.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">Pasta de saída [Enter = /home/demo/ProjectStructureReports]: </text><text x="481.5" y="425.0" font-family="PMono" font-size="12.5" fill="#2D7560" text-anchor="start" >(Enter)</text><text x="24.0" y="463.0" font-family="PMono" font-size="12.5" fill="#8C5F0E" text-anchor="start" xml:space="preserve">AVISO: nomes internos podem ser confidenciais. Não publique esse ZIP.</text><text x="24.0" y="482.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">Iniciar análise? [S/n]: </text><text x="204.0" y="482.0" font-family="PMono" font-size="12.5" fill="#2D7560" text-anchor="start" >s</text><text x="24.0" y="520.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">[1/3] Lendo a estrutura (o projeto NÃO é alterado)...</text><text x="24.0" y="539.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">[2/3] Organizando as informações...</text><text x="24.0" y="558.0" font-family="PMono" font-size="12.5" fill="#59626A" text-anchor="start" xml:space="preserve">[3/3] Gerando o ZIP...</text><text x="24.0" y="596.0" font-family="PMono" font-size="12.5" fill="#3F7A1F" text-anchor="start" xml:space="preserve">✓ Concluído! 15 arquivo(s) indexado(s).</text><text x="24.0" y="615.0" font-family="PMono" font-size="12.5" fill="#3F7A1F" text-anchor="start" xml:space="preserve">✓ 16 referência(s) estática(s) registrada(s).</text><text x="24.0" y="634.0" font-family="PMono" font-size="12.5" fill="#3F7A1F" text-anchor="start" xml:space="preserve">✓ 1 arquivo(s) sensível(is) omitido(s) por segurança.</text><text x="24.0" y="653.0" font-family="PMono" font-size="12.5" fill="#3F7A1F" text-anchor="start" xml:space="preserve">✓ O código do projeto NÃO foi copiado para o ZIP.</text><line x1="0" y1="686" x2="860" y2="686" stroke="#D3DADE" stroke-width="1"/><text x="24.0" y="705.0" font-family="PMono" font-size="11" fill="#59626A" text-anchor="start" >Trechos de uma execução real (terminal Linux, projeto fictício). Em destaque: o que foi digitado.</text></svg>

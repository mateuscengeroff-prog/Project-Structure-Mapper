<svg xmlns="http://www.w3.org/2000/svg" width="400" height="468" viewBox="0 0 400 468" role="img" aria-labelledby="t d"><title id="t">Using the assistant</title><desc id="d">Using the assistant. 1. Start it: Double-click INICIAR_WINDOWS.bat, or drop a project folder onto it. 2. Pick the folder: Paste a path or choose the folder in a picker window. 3. Pick a mode: A public summary to share, or a private report for internal use. 4. Get the reports: A new folder outside the project, with Markdown, JSON and a ZIP.</desc><style>@font-face{font-family:PMono;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:PSans;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:PSansMedium;src:url(data:font/woff;base64,) format('woff');}@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style><text x="20.0" y="32.0" font-family="PMono" font-size="12" fill="#8F989E" text-anchor="start" >Using the assistant</text><line x1="20" y1="46" x2="380" y2="46" stroke="#2B333C" stroke-width="1"/><path d="M28,58 V355" stroke="#3B434B" stroke-width="2"/><text x="50.0" y="62.0" font-family="PMono" font-size="12" fill="#7DB8A3" text-anchor="start" >01</text><text x="50.0" y="82.0" font-family="PSansMedium" font-size="17" fill="#E3E7E4" text-anchor="start" >Start it</text><text x="50.0" y="105.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >Double-click INICIAR_WINDOWS.bat, or drop</text><text x="50.0" y="126.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >a project folder onto it.</text><text x="50.0" y="161.0" font-family="PMono" font-size="12" fill="#7DB8A3" text-anchor="start" >02</text><text x="50.0" y="181.0" font-family="PSansMedium" font-size="17" fill="#E3E7E4" text-anchor="start" >Pick the folder</text><text x="50.0" y="204.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >Paste a path or choose the folder in a picker</text><text x="50.0" y="225.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >window.</text><text x="50.0" y="260.0" font-family="PMono" font-size="12" fill="#7DB8A3" text-anchor="start" >03</text><text x="50.0" y="280.0" font-family="PSansMedium" font-size="17" fill="#E3E7E4" text-anchor="start" >Pick a mode</text><text x="50.0" y="303.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >A public summary to share, or a private report</text><text x="50.0" y="324.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >for internal use.</text><text x="50.0" y="359.0" font-family="PMono" font-size="12" fill="#7DB8A3" text-anchor="start" >04</text><text x="50.0" y="379.0" font-family="PSansMedium" font-size="17" fill="#E3E7E4" text-anchor="start" >Get the reports</text><text x="50.0" y="402.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >A new folder outside the project, with</text><text x="50.0" y="423.0" font-family="PSans" font-size="15" fill="#8F989E" text-anchor="start" >Markdown, JSON and a ZIP.</text><circle cx="28" cy="58" r="5" fill="#11161D" stroke="#7DB8A3" stroke-width="2"/><circle cx="28" cy="157" r="5" fill="#11161D" stroke="#7DB8A3" stroke-width="2"/><circle cx="28" cy="256" r="5" fill="#11161D" stroke="#7DB8A3" stroke-width="2"/><circle cx="28" cy="355" r="5" fill="#11161D" stroke="#7DB8A3" stroke-width="2"/></svg>
